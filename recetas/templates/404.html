<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Receta no encontrada</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fcf8f2;
            color: #333;
            text-align: center;
            padding: 80px 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 72px;
            color: #d9534f;
            margin: 0;
        }
        h2 {
            font-size: 24px;
            color: #444;
            margin-top: 10px;
        }
        p {
            font-size: 16px;
            color: #666;
            margin: 20px 0;
        }
        a {
            display: inline-block;
            text-decoration: none;
            background-color: #e67e22;
            color: white;
            padding: 12px 24px;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        a:hover {
            background-color: #d35400;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>¡Ups! Receta o ruta no encontrada</h2>
        <p>El ingrediente o enlace culinario que intentas consultar no existe en el sistema.</p>
        <a href="/">Volver al recetario</a>
    </div>
</body>
</html>
